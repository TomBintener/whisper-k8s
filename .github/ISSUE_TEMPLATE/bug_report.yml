name: "Bug Report"
description: "File an issue to help us reproduce and fix a bug in whisper-k8s"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us triage and resolve the bug.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution Mode
      description: Which execution mode was active when the bug occurred?
      options:
        - "pool (Warm Worker Pool)"
        - "kubernetes (Ephemeral Batch Job)"
        - "pod (Direct Pod)"
        - "ssh (Bare-Metal Proxy)"
        - "standalone (Docker Compose)"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Inference Backend
      options:
        - "faster-whisper"
        - "openai-whisper"
        - "whisper.cpp"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or API curl command used to trigger the issue.
      placeholder: |
        1. Submit job via POST /jobs with payload...
        2. Worker polls queue...
        3. Observed error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please paste any relevant logs from the bridge or worker daemon.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, GPU model (if applicable), and Python version.
      placeholder: "e.g. Ubuntu 22.04, NVIDIA RTX 4090, Python 3.11"
