[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-k8s"
version = "1.0.0"
description = "High-throughput, distributed Whisper speech-to-text platform for Kubernetes, bare-metal, and warm worker pools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TomBi", email = "tom.bintener@gmail.com" }
]
keywords = [
    "whisper",
    "kubernetes",
    "speech-to-text",
    "transcription",
    "gpu",
    "keda",
    "fastapi",
    "vad",
    "subtitles"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "kubernetes>=29.0.0",
    "redis>=5.0.0",
    "faster-whisper>=1.2.1",
    "openai-whisper>=20240930",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/TomBi/whisper-k8s"
Documentation = "https://github.com/TomBi/whisper-k8s/blob/master/README.md"
Repository = "https://github.com/TomBi/whisper-k8s.git"
Issues = "https://github.com/TomBi/whisper-k8s/issues"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
