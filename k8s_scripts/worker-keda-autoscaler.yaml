apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: whisper-worker-autoscaler
  namespace: whisper
  labels:
    app: whisper-worker-pool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whisper-worker-pool
  minReplicaCount: 0
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    # 1. Prometheus Queue Backlog Trigger:
    # Evaluates cluster queue backlog. Scales workers elastically based on pending jobs.
    - type: prometheus
      metadata:
        serverAddress: http://whisper-bridge.whisper.svc.cluster.local:8080/metrics
        metricName: whisper_queue_depth
        query: sum(whisper_queue_depth{queue="pending"})
        threshold: "2"
        activationThreshold: "1"
    # 2. Redis Native Trigger (Alternative for direct Redis deployments):
    # - type: redis
    #   metadata:
    #     addressFromEnv: REDIS_URL
    #     listName: whisper:jobs:pending
    #     listLength: "2"
    #     activationListLength: "1"
